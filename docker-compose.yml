# Single-server deployment: app + Postgres + automatic HTTPS (Caddy).
# Files live in your S3/R2 bucket, so the server stays small.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://easyshare:${POSTGRES_PASSWORD}@db:5432/easyshare
      PGSSL: "false"
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easyshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: easyshare
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
